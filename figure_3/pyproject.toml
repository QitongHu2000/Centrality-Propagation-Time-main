# One formatter for the maintained revision code. Archived sources retain their
# exact bytes so that recorded experiment hashes remain verifiable.
[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '/(archive|results|figures|reports)/'

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["data", "results", "reports"]

[tool.ruff.lint]
select = ["F"]
